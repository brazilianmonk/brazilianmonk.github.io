        let score = 0;

        let currentQuestions = [];
        const options = ["who", "which", "that", "whose", "whom", "Ø"];
        const BEST_SCORE_KEY = 'bestScore-relativeClauses';

        let bestScore = 0;
        try {
            bestScore = parseInt(localStorage.getItem(BEST_SCORE_KEY), 10) || 0;
        } catch (e) {
            // localStorage unavailable (e.g. private browsing) — start at 0
        }

        function getRandomQuestions() {
            const shuffled = questionBank.sort(() => 0.5 - Math.random());
            return shuffled.slice(0, total);
        }

        function loadQuiz() {
            currentQuestions = getRandomQuestions();
            const quizDiv = document.getElementById('quiz');
            quizDiv.innerHTML = '';
            currentQuestions.forEach((q, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question';
                questionDiv.dataset.index = index;
                const opts = q.options || options;
                const sentenceHtml = q.sentence
                    ? q.sentence.replace('___', '<span class="drop-zone" id="drop' + index + '"></span>')
                    : '';
                const promptHtml = q.prompt ? `<div class="prompt">${q.prompt}</div>` : '';
                questionDiv.innerHTML = `
                    ${promptHtml}
                    <div class="sentence">${sentenceHtml}</div>
                    <div class="options">
                        ${opts.map(opt => `<button type="button" class="pronoun-option">${opt}</button>`).join('')}
                    </div>
                    <div class="feedback" id="feedback${index}"></div>
                `;
                quizDiv.appendChild(questionDiv);
            });
            addClickListeners();
            updateScore();
        }

        function addClickListeners() {
            document.querySelectorAll('.question').forEach(questionDiv => {
                const zone = questionDiv.querySelector('.drop-zone');
                const index = questionDiv.dataset.index;
                questionDiv.querySelectorAll('.pronoun-option').forEach(option => {
                    option.addEventListener('click', () => {
                        if (questionDiv.dataset.locked) return;
                        questionDiv.dataset.locked = 'true';
                        const pronoun = option.textContent.trim();
                        if (zone) zone.textContent = pronoun;
                        checkAnswer(index, pronoun);
                        questionDiv.querySelectorAll('.pronoun-option').forEach(btn => {
                            if (btn !== option) btn.disabled = true;
                        });
                    });
                });
            });
        }

        function checkAnswer(index, pronoun) {
    const feedback = document.getElementById(`feedback${index}`);
    const correctAnswers = currentQuestions[index].answers;
    if (correctAnswers.includes(pronoun)) {
        feedback.className = 'feedback correct';
        feedback.innerHTML = `Correct! ${currentQuestions[index].explanation}`;
        if (!feedback.dataset.answered) {
            score++;
            feedback.dataset.answered = true;
        }
    } else {
        feedback.className = 'feedback incorrect';
        feedback.innerHTML = `Incorrect. ${currentQuestions[index].explanation}`;
        if (feedback.dataset.answered) {
            score--;
            feedback.dataset.answered = false;
        }
    }
    updateScore();
}

        function updateScore() {
            if (score > bestScore) {
                bestScore = score;
                try {
                    localStorage.setItem(BEST_SCORE_KEY, bestScore);
                } catch (e) {
                    // ignore write errors — keep the session best in memory
                }
            }
            document.getElementById('score').innerHTML = `Score: ${score} / ${total} &middot; Best: ${bestScore}`;
        }

        function resetQuiz() {
            score = 0;
            currentQuestions.forEach((q, index) => {
                const feedback = document.getElementById(`feedback${index}`);
                if (feedback) feedback.dataset.answered = false;
            });
            loadQuiz();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
