    { sentence: "It was ___ small a room for three people.", options: ["too", "such", "rather", "very"], answer: "too", explanation: "With 'too' the article comes after the adjective: too + adj + a + noun." },
    { sentence: "It was ___ boring a film that we left early.", options: ["so", "such", "too", "very"], answer: "so", explanation: "With a 'that' result clause: so + adj + a + noun. ('Such a boring film' is the alternative structure.)" },
    { sentence: "She has quite ___ few cousins abroad.", options: ["a", "Ø", "the", "an"], answer: "a", explanation: "'Quite a few' (= quite many) is a fixed phrase that keeps the article." },
    { sentence: "Many ___ student has made this mistake.", options: ["a", "an", "the", "Ø"], answer: "a", explanation: "'Many a + singular noun' is a fixed (formal/literary) structure meaning 'many'." },
    { sentence: "It takes half ___ hour to get there.", options: ["an", "a", "the", "Ø"], answer: "an", explanation: "Fixed phrase 'half an hour' — the vowel sound of 'hour' requires 'an'." },
    { sentence: "It was ___ most unusual gift.", options: ["a", "the", "Ø", "an"], answer: "a", explanation: "'A most + adjective' means 'very' — it is not a superlative, so no 'the'." },
    { sentence: "Surprisingly, ___ number of problems have come up.", options: ["a", "the", "Ø", "an"], answer: "a", explanation: "'A number of' = many (plural verb 'have come'); 'the number of' would take a singular verb." },
    // Harder cases: sounds, fixed phrases, and article omission
    { sentence: "She waited for ___ hour outside the office.", answer: "an", explanation: "'An' is used before a silent 'h' — 'hour' starts with a vowel sound /aʊ/." },
    { sentence: "He is ___ heir to a large fortune.", answer: "an", explanation: "'An' is used before a silent 'h' — 'heir' starts with a vowel sound /eə/." },
    { sentence: "She has ___ MBA from a top school.", answer: "an", explanation: "'An' is used before abbreviations starting with a vowel sound — 'MBA' is pronounced /em/." },
    { sentence: "He works with ___ European charity.", answer: "a", explanation: "'A' is used because 'European' starts with a consonant sound /j/ (yu-)." },
    { sentence: "She attends ___ university in Rome.", answer: "a", explanation: "'A' is used because 'university' starts with a consonant sound /j/ (yu-)." },
    { sentence: "They stayed in ___ same hotel as us.", answer: "the", explanation: "'The same' is a fixed phrase — it always takes 'the'." },
    { sentence: "In ___ 1990s, everything changed.", answer: "the", explanation: "'The' is used with decades: the 1990s, the twenties." },
    { sentence: "He was elected ___ president of the club.", answer: "Ø", explanation: "Zero article is used with unique positions/titles after 'elect', 'appoint', etc." },
    { sentence: "___ most students enjoy the holidays.", answer: "Ø", explanation: "Zero article is used when 'most' means 'the majority of' before a plural noun." },
    { sentence: "It is one of ___ best novels ever written.", answer: "the", explanation: "'One of the + superlative + plural noun' always takes 'the'." }
        ];

        let score = 0;
        let total = 20; // Number of questions per quiz
        let currentQuestions = [];
        const options = ["a", "an", "the", "Ø"];
        const BEST_SCORE_KEY = 'bestScore-articlePractice';

        let bestScore = 0;
        try {
            bestScore = parseInt(localStorage.getItem(BEST_SCORE_KEY), 10) || 0;
        } catch (e) {
            // localStorage unavailable (e.g. private browsing) — start at 0
        }

        function getRandomQuestions() {
            const shuffled = questionBank.sort(() => 0.5 - Math.random());
            return shuffled.slice(0, total);
        }

        function loadQuiz() {
            currentQuestions = getRandomQuestions();
            const quizDiv = document.getElementById('quiz');
            quizDiv.innerHTML = '';
            currentQuestions.forEach((q, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question';
                questionDiv.innerHTML = `
                    <div class="sentence">${q.sentence.replace('___', '<span class="drop-zone" id="drop' + index + '"></span>')}</div>
                    <div class="options">
                        ${(q.options || options).map(opt => `<button type="button" class="article-option">${opt}</button>`).join('')}
                    </div>
                    <div class="feedback" id="feedback${index}"></div>
                `;
                quizDiv.appendChild(questionDiv);
            });
            addClickListeners();
            updateScore();
        }

        function addClickListeners() {
            document.querySelectorAll('.question').forEach(questionDiv => {
                const zone = questionDiv.querySelector('.drop-zone');
                const index = zone.id.replace('drop', '');
                questionDiv.querySelectorAll('.article-option').forEach(option => {
                    option.addEventListener('click', () => {
                        if (questionDiv.dataset.locked) return;
                        questionDiv.dataset.locked = 'true';
                        const article = option.textContent.trim();
                        zone.textContent = article;
                        checkAnswer(index, article);
                        questionDiv.querySelectorAll('.article-option').forEach(btn => {
                            if (btn !== option) btn.disabled = true;
                        });
                    });
                });
            });
        }

        function checkAnswer(index, article) {
            const feedback = document.getElementById(`feedback${index}`);
            const correct = currentQuestions[index].answer;
            if (article === correct) {
                feedback.className = 'feedback correct';
                feedback.innerHTML = `Correct! ${currentQuestions[index].explanation}`;
                if (!feedback.dataset.answered) {
                    score++;
                    feedback.dataset.answered = true;
                }
            } else {
                feedback.className = 'feedback incorrect';
                feedback.innerHTML = `Incorrect. ${currentQuestions[index].explanation}`;
                if (feedback.dataset.answered) {
                    score--;
                    feedback.dataset.answered = false;
                }
            }
            updateScore();
        }

        function updateScore() {
            if (score > bestScore) {
                bestScore = score;
                try {
                    localStorage.setItem(BEST_SCORE_KEY, bestScore);
                } catch (e) {
                    // ignore write errors — keep the session best in memory
                }
            }
            document.getElementById('score').innerHTML = `Score: ${score} / ${total} &middot; Best: ${bestScore}`;
        }

        function resetQuiz() {
            score = 0;
            currentQuestions.forEach((q, index) => {
                const feedback = document.getElementById(`feedback${index}`);
                if (feedback) feedback.dataset.answered = false;
            });
            loadQuiz();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Load quiz on page load
        loadQuiz();
    </script>
</body>
</html>
