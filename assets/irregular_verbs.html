<!-- index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Irregular Verbs Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .quiz-container {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 2rem;
            margin-top: 2rem;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
        .form-control {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 quiz-container">
                <h1 class="text-center mb-4">Irregular Verbs Quiz</h1>
                <div class="d-flex justify-content-between mb-3">
                    <button onclick="toggleVerbList()" class="btn btn-success" id="toggleListButton">Show List</button>
                    <div>
                        <button onclick="resetProgress()" class="btn btn-danger">Reset</button>
                        <button onclick="shuffleRemainingWords()" class="btn btn-info ms-2">Shuffle Remaining</button>
                    </div>
                </div>
                <div id="quiz">
                    <h3 id="currentWord" class="mb-3"></h3>
                    <div class="mb-3">
                        <input type="text" id="pastInput" class="form-control" placeholder="Past tense">
                    </div>
                    <div class="mb-3">
                        <input type="text" id="pastParticipleInput" class="form-control" placeholder="Past participle">
                    </div>
                    <div id="buttonGroup" class="d-flex gap-2">
                        <button onclick="checkAnswer()" class="btn btn-primary">Submit</button>
                        <button onclick="nextWord()" class="btn btn-secondary" id="nextButton" style="display: none;">Next</button>
                    </div>
                    <div id="feedback" class="mt-3"></div>
                    <div id="progress" class="mt-3 text-muted"></div>
                </div>
                <div id="verbListContainer" class="mt-4" style="display: none;"></div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/verbs.js"></script>
    <script>
    let currentIndex = 0;
    let verbList = [...irregularVerbs];
    let showingFeedback = false;
    let isListVisible = false;

    // Load progress from localStorage
    function loadProgress() {
        const savedIndex = localStorage.getItem('quizCurrentIndex');
        const savedList = localStorage.getItem('quizVerbList');
        if (savedIndex !== null) {
            currentIndex = parseInt(savedIndex, 10);
        }
        if (savedList !== null) {
            verbList = JSON.parse(savedList);
        }
    }

    // Save progress to localStorage
    function saveProgress() {
        localStorage.setItem('quizCurrentIndex', currentIndex);
        localStorage.setItem('quizVerbList', JSON.stringify(verbList));
    }

    // Reset progress
    function resetProgress() {
        currentIndex = 0;
        verbList = [...irregularVerbs];
        localStorage.removeItem('quizCurrentIndex');
        localStorage.removeItem('quizVerbList');
        document.getElementById('verbListContainer').style.display = 'none';
        document.getElementById('toggleListButton').textContent = 'Show List';
        isListVisible = false;
        displayWord();
    }

    // Shuffle remaining words
    function shuffleRemainingWords() {
        const remainingWords = verbList.slice(currentIndex);
        for (let i = remainingWords.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [remainingWords[i], remainingWords[j]] = [remainingWords[j], remainingWords[i]];
        }
        verbList = verbList.slice(0, currentIndex).concat(remainingWords);
        saveProgress();
        document.getElementById('verbListContainer').style.display = 'none';
        document.getElementById('toggleListButton').textContent = 'Show List';
        isListVisible = false;
        displayWord();
    }

    // Toggle the verb list visibility
    function toggleVerbList() {
        const container = document.getElementById('verbListContainer');
        const button = document.getElementById('toggleListButton');
        if (!isListVisible) {
            let html = '<h3>Irregular Verbs List</h3><table class="table table-striped"><thead><tr><th>Base</th><th>Past</th><th>Past Participle</th></tr></thead><tbody>';
            irregularVerbs.sort((a, b) => a.base.localeCompare(b.base)).forEach(verb => {
                html += `<tr><td>${verb.base}</td><td>${verb.past.join(' or ')}</td><td>${verb.pastParticiple.length > 0 ? verb.pastParticiple.join(' or ') : '(none)'}</td></tr>`;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
            container.style.display = 'block';
            button.textContent = 'Hide List';
            isListVisible = true;
        } else {
            container.style.display = 'none';
            button.textContent = 'Show List';
            isListVisible = false;
        }
    }

    function displayWord() {
        if (currentIndex >= verbList.length) {
            document.getElementById('quiz').innerHTML = '<h2 class="text-success text-center">Congratulations! You completed the quiz!</h2>';
            localStorage.removeItem('quizCurrentIndex');
            return;
        }

        showingFeedback = false;
        const verb = verbList[currentIndex];
        document.getElementById('currentWord').textContent = `Base form: ${verb.base}`;
        document.getElementById('pastInput').value = '';
        document.getElementById('pastParticipleInput').value = '';
        document.getElementById('feedback').innerHTML = '';
        document.getElementById('progress').textContent = `Progress: ${currentIndex + 1}/${verbList.length}`;
        document.getElementById('nextButton').style.display = 'none';
        document.getElementById('pastInput').focus();
        saveProgress();
    }

    function checkAnswer() {
        if (showingFeedback) return;

        const verb = verbList[currentIndex];
        const pastInput = document.getElementById('pastInput').value.trim().toLowerCase();
        const ppInput = document.getElementById('pastParticipleInput').value.trim().toLowerCase();

        const isPastCorrect = verb.past.includes(pastInput);
        const isPPCorrect = verb.pastParticiple.length === 0 || verb.pastParticiple.includes(ppInput);

        if (isPastCorrect && isPPCorrect) {
            let feedback = '<div class="alert alert-success fs-4"><strong>Correct!</strong> Full answer is:<br>';
            feedback += `Past: <strong>${verb.past.join(' or ')}</strong><br>`;
            feedback += verb.pastParticiple.length > 0 ?
                `Past Participle: <strong>${verb.pastParticiple.join(' or ')}</strong></div>` :
                'Past Participle: (none)</div>';
            document.getElementById('feedback').innerHTML = feedback;
            setTimeout(nextWord, 1000);

        } else {
            showingFeedback = true;
            let feedback = '<div class="alert alert-danger fs-4"><strong>Wrong!</strong> Correct answers:<br>';
            feedback += `Past: ${verb.past.join(' or ')}<br>`;
            feedback += verb.pastParticiple.length > 0 ?
                `Past Participle: ${verb.pastParticiple.join(' or ')}</div>` :
                'Past Participle: (none)</div>';
            document.getElementById('feedback').innerHTML = feedback;
            document.getElementById('nextButton').style.display = 'inline-block';
            verbList.push(verbList.splice(currentIndex, 1)[0]);
            saveProgress();
        }
    }

    function nextWord() {
        currentIndex++;
        displayWord();
    }

    // Start the quiz
    loadProgress();
    displayWord();

    // Allow Enter key to submit or move to next
    document.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            if (showingFeedback) {
                nextWord();
            } else {
                checkAnswer();
            }
        }
    });
    </script>
</body>

</html>
