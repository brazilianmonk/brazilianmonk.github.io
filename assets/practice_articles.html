<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article Practice Drag-and-Drop App</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
            background-color: #e9ecef;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .question {
            margin: 20px 0;
            padding: 15px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }
        .sentence {
            font-size: 18px;
            margin-bottom: 15px;
            display: inline-block;
        }
        .drop-zone {
            display: inline-block;
            width: 60px;
            height: 30px;
            border: 2px dashed #007bff;
            border-radius: 5px;
            text-align: center;
            line-height: 30px;
            vertical-align: middle;
            cursor: pointer;
        }
        .article-option {
            display: inline-block;
            padding: 5px 10px;
            margin: 5px;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            cursor: move;
            user-select: none;
        }
        .article-option.dragging {
            opacity: 0.5;
        }
        .feedback {
            margin-top: 10px;
            font-size: 16px;
            font-weight: bold;
        }
        .correct { color: #28a745; }
        .incorrect { color: #dc3545; }
        #score {
            text-align: center;
            font-size: 20px;
            margin: 20px 0;
            color: #2c3e50;
        }
        button {
            display: block;
            margin: 20px auto;
            padding: 12px 25px;
            font-size: 16px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #218838;
        }
        @media (max-width: 600px) {
            .sentence { font-size: 16px; }
            .drop-zone { width: 50px; height: 25px; line-height: 25px; }
            .article-option { padding: 4px 8px; font-size: 14px; }
        }
    </style>
</head>

        let score = 0;
        let total = 20; // Number of questions per quiz
        let currentQuestions = [];
        const options = ["a", "an", "the", "Ø"];

        function getRandomQuestions() {
            const shuffled = questionBank.sort(() => 0.5 - Math.random());
            return shuffled.slice(0, total);
        }

        function loadQuiz() {
            currentQuestions = getRandomQuestions();
            const quizDiv = document.getElementById('quiz');
            quizDiv.innerHTML = '';
            currentQuestions.forEach((q, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question';
                questionDiv.innerHTML = `
                    <div class="sentence">${q.sentence.replace('___', '<span class="drop-zone" id="drop' + index + '"></span>')}</div>
                    <div class="options">
                        ${options.map(opt => `<span class="article-option" draggable="true">${opt}</span>`).join('')}
                    </div>
                    <div class="feedback" id="feedback${index}"></div>
                `;
                quizDiv.appendChild(questionDiv);
            });
            addDragAndDropListeners();
            updateScore();
        }

        function addDragAndDropListeners() {
            document.querySelectorAll('.article-option').forEach(option => {
                option.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text', e.target.textContent);
                    e.target.classList.add('dragging');
                });
                option.addEventListener('dragend', (e) => {
                    e.target.classList.remove('dragging');
                });
            });

            document.querySelectorAll('.drop-zone').forEach(zone => {
                zone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                });
                zone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const article = e.dataTransfer.getData('text');
                    const index = zone.id.replace('drop', '');
                    zone.textContent = article;
                    checkAnswer(index, article);
                });
            });
        }

        function checkAnswer(index, article) {
            const feedback = document.getElementById(`feedback${index}`);
            const correct = currentQuestions[index].answer;
            if (article === correct) {
                feedback.className = 'feedback correct';
                feedback.innerHTML = `Correct! ${currentQuestions[index].explanation}`;
                if (!feedback.dataset.answered) {
                    score++;
                    feedback.dataset.answered = true;
                }
            } else {
                feedback.className = 'feedback incorrect';
                feedback.innerHTML = `Incorrect. ${currentQuestions[index].explanation}`;
                if (feedback.dataset.answered) {
                    score--;
                    feedback.dataset.answered = false;
                }
            }
            updateScore();
        }

        function updateScore() {
            document.getElementById('score').innerHTML = `Score: ${score} / ${total}`;
        }

        function resetQuiz() {
            score = 0;
            currentQuestions.forEach((q, index) => {
                const feedback = document.getElementById(`feedback${index}`);
                if (feedback) feedback.dataset.answered = false;
            });
            loadQuiz();
        }

        // Load quiz on page load
        loadQuiz();
    </script>
</body>
</html>
