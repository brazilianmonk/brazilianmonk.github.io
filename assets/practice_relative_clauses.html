        let score = 0;
        let total = 20; // Number of questions per quiz
        let currentQuestions = [];
        const options = ["who", "which", "that", "whose", "whom", "Ø"];

        function getRandomQuestions() {
            const shuffled = questionBank.sort(() => 0.5 - Math.random());
            return shuffled.slice(0, total);
        }

        function loadQuiz() {
            currentQuestions = getRandomQuestions();
            const quizDiv = document.getElementById('quiz');
            quizDiv.innerHTML = '';
            currentQuestions.forEach((q, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question';
                questionDiv.innerHTML = `
                    <div class="sentence">${q.sentence.replace('___', '<span class="drop-zone" id="drop' + index + '"></span>')}</div>
                    <div class="options">
                        ${options.map(opt => `<span class="pronoun-option" draggable="true">${opt}</span>`).join('')}
                    </div>
                    <div class="feedback" id="feedback${index}"></div>
                `;
                quizDiv.appendChild(questionDiv);
            });
            addDragAndDropListeners();
            updateScore();
        }

        function addDragAndDropListeners() {
            document.querySelectorAll('.pronoun-option').forEach(option => {
                option.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text', e.target.textContent);
                    e.target.classList.add('dragging');
                });
                option.addEventListener('dragend', (e) => {
                    e.target.classList.remove('dragging');
                });
            });

            document.querySelectorAll('.drop-zone').forEach(zone => {
                zone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                });
                zone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const pronoun = e.dataTransfer.getData('text');
                    const index = zone.id.replace('drop', '');
                    zone.textContent = pronoun;
                    checkAnswer(index, pronoun);
                });
            });
        }

        function checkAnswer(index, pronoun) {
    const feedback = document.getElementById(`feedback${index}`);
    const correctAnswers = currentQuestions[index].answers;
    if (correctAnswers.includes(pronoun)) {
        feedback.className = 'feedback correct';
        feedback.innerHTML = `Correct! ${currentQuestions[index].explanation}`;
        if (!feedback.dataset.answered) {
            score++;
            feedback.dataset.answered = true;
        }
    } else {
        feedback.className = 'feedback incorrect';
        feedback.innerHTML = `Incorrect. ${currentQuestions[index].explanation}`;
        if (feedback.dataset.answered) {
            score--;
            feedback.dataset.answered = false;
        }
    }
    updateScore();
}

        function updateScore() {
            document.getElementById('score').innerHTML = `Score: ${score} / ${total}`;
        }

        function resetQuiz() {
            score = 0;
            currentQuestions.forEach((q, index) => {
                const feedback = document.getElementById(`feedback${index}`);
                if (feedback) feedback.dataset.answered = false;
            });
            loadQuiz();
        }

        // Load quiz on page load
        loadQuiz();
