name: Newsletter

on:
  push:
    branches: [gh-pages]
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: write         # needed to commit the state file back

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install Jekyll
        run: gem install jekyll --no-document

      - name: Build site
        run: jekyll build

      - name: Announce new posts to Kit subscribers
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          KIT_EMAIL_TEMPLATE_ID: ${{ secrets.KIT_EMAIL_TEMPLATE_ID }}
        run: python3 scripts/send_newsletter.py --limit 3 --delay-minutes 5

      - name: Commit announcement state
        run: |
          git config user.name "newsletter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/newsletter_state.json
          git diff --cached --quiet || git commit -m "newsletter: mark posts announced [skip ci]"
          git push
