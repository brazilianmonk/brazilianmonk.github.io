<header class="site-header">
  <h3 class="site-title">
    <a href="{{ site.github.url }}/" aria-label="Brazilian Monk home">
      {% if page.url == '/' %}
        <img src="/assets/img/brazilian-monk-to-brm.gif" width="250" class="no-style logo--home" alt="Brazilian Monk">
      {% else %}
        <img src="/assets/img/brm-logo.png" width="50" class="no-style logo--mini" alt="BRM">
      {% endif %}
    </a>
  </h3>

  <div class="nav-search" id="nav-search">
    <div class="search-input-wrapper">
      <i class="fa fa-search search-icon" aria-hidden="true"></i>
      <input type="text" id="nav-search-input" placeholder="Search..." autocomplete="off"
             role="combobox" aria-expanded="false" aria-controls="results-container">
      <button type="button" class="search-clear" id="search-clear" aria-label="Clear search">&times;</button>
    </div>
    <ul id="results-container" role="listbox" aria-label="Search results"></ul>
  </div>

  <nav class="menu-list">
    {% for item in site.data.settings.menu %}
      <a href="{{ site.github.url }}/{{ item.url }}" class="menu-link">{{ item.name }}</a>
    {% endfor %}
  </nav>

  <div class="dropdown">
    <button class="dropbtn" aria-label="Menu"><i class="fa fa-bars" aria-hidden="true"></i></button>
    <div class="dropdown-content">
      {% for item in site.data.settings.menu %}
        <a href="{{ site.github.url }}/{{ item.url }}" class="menu-link">{{ item.name }}</a>
      {% endfor %}
    </div>
  </div>
</header>

<script>
(function () {
  var searchBox = document.getElementById('nav-search');
  var input = document.getElementById('nav-search-input');
  var clearBtn = document.getElementById('search-clear');
  var results = document.getElementById('results-container');
  var index = null;          // loaded lazily on first search
  var activeIdx = -1;        // keyboard-highlighted result

  function loadIndex() {
    if (index) return Promise.resolve(index);
    return fetch('/search.json')
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) { index = data; return data; })
      .catch(function () { index = []; return []; });
  }

  // Ranked contains-match: title hits first, then content hits. Empty query
  // returns nothing (no "show everything" dump).
  function searchPages(q) {
    q = q.toLowerCase();
    var out = [];
    for (var i = 0; i < index.length; i++) {
      var p = index[i];
      var t = (p.title || '').toLowerCase();
      var c = (p.content || '').toLowerCase();
      var ti = t.indexOf(q);
      var ci = c.indexOf(q);
      if (ti === -1 && ci === -1) continue;
      var score = ti === 0 ? 0 : ti > 0 ? 1 : ci === 0 ? 2 : 3;
      var start = Math.max(0, (ci === -1 ? ti : ci) - 40);
      out.push({ p: p, score: score, snippet: p.content.substring(start, start + 130) });
      if (out.length > 200) break;
    }
    out.sort(function (a, b) { return a.score - b.score; });
    return out;
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // Pages without a front-matter title come through as their URL; turn
  // "/summaries/eng/absolute-phrases" into "Absolute phrases" for display.
  function displayTitle(p) {
    var t = p.title || '';
    if (t && t.charAt(0) !== '/') return t;
    var seg = (p.url || '').replace(/\/+$/, '').split('/').pop() || p.url || '';
    return seg.replace(/-/g, ' ').replace(/^./, function (ch) { return ch.toUpperCase(); });
  }

  function render(list) {
    results.innerHTML = '';
    activeIdx = -1;
    if (list.length === 0) {
      results.innerHTML = '<li class="search-no-results">No results found</li>';
      show();
      return;
    }
    var shown = list.slice(0, 8);
    shown.forEach(function (item) {
      var li = document.createElement('li');
      li.setAttribute('role', 'option');
      li.innerHTML =
        '<a href="' + item.p.url + '">' +
        '<span class="res-t">' + escapeHtml(displayTitle(item.p)) + '</span>' +
        '<span class="res-d">' + escapeHtml(item.snippet) + '…</span>' +
        '</a>';
      li.querySelector('a').addEventListener('click', close);
      results.appendChild(li);
    });
    show();
  }

  function show() { results.classList.add('is-visible'); input.setAttribute('aria-expanded', 'true'); }
  function close() {
    results.classList.remove('is-visible');
    input.setAttribute('aria-expanded', 'false');
    activeIdx = -1;
  }
  function hasResults() { return results.classList.contains('is-visible'); }

  function setActive(n) {
    var items = results.querySelectorAll('li a');
    if (!items.length) return;
    activeIdx = (activeIdx + n + items.length) % items.length;
    items.forEach(function (a, i) { a.classList.toggle('is-active', i === activeIdx); });
    items[activeIdx].scrollIntoView({ block: 'nearest' });
  }

  var debounceId = null;
  input.addEventListener('input', function () {
    var q = input.value.trim();
    clearBtn.classList.toggle('is-visible', q.length > 0);
    clearTimeout(debounceId);
    if (!q) { close(); return; }
    debounceId = setTimeout(function () {
      loadIndex().then(function () { render(searchPages(q)); });
    }, 120);
  });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (hasResults()) setActive(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (hasResults()) setActive(-1); }
    else if (e.key === 'Enter') {
      var items = results.querySelectorAll('li a');
      if (activeIdx >= 0 && items[activeIdx]) { e.preventDefault(); items[activeIdx].click(); }
      else if (items.length) { e.preventDefault(); items[0].click(); }
    }
    else if (e.key === 'Escape') { close(); input.blur(); }
  });

  clearBtn.addEventListener('click', function () {
    input.value = '';
    clearBtn.classList.remove('is-visible');
    close();
    input.focus();
  });

  document.addEventListener('click', function (e) {
    if (!searchBox.contains(e.target)) close();
  });
})();
</script>
