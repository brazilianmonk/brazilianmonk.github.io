<header class="site-header">
  <!-- Site Title (Left) -->
  <h3 class="site-title">
    <a href="{{ site.github.url }}/"> <img src="/assets/img/logo-img.jpg" width="250"></a>
  </h3>

  <!-- Search Bar (Middle/Right) -->
  <div class="nav-search">
    <div class="search-input-wrapper">
      <i class="fa fa-search search-icon"></i>
      <input type="text" id="nav-search-input" placeholder="Search...">
    </div>
    <ul id="results-container"></ul>
  </div>

  <!-- Navigation Menu (Desktop, Right) -->
  <nav class="menu-list">
    {% for item in site.data.settings.menu %}
      <a href="{{ site.github.url }}/{{ item.url }}" class="menu-link">{{ item.name }}</a>
    {% endfor %}
  </nav>

  <!-- Dropdown Menu (Mobile, Right) -->
  <div class="dropdown">
    <button class="dropbtn" aria-label="Menu"><i class="fa fa-bars" aria-hidden="true"></i></button>
    <div class="dropdown-content">
      <!-- Search included in mobile menu for better UX -->
      <div class="mobile-search-padding">
         <!-- Search bar is shared via CSS or you can duplicate the input here if needed -->
      </div>
      {% for item in site.data.settings.menu %}
        <a href="{{ site.github.url }}/{{ item.url }}" class="menu-link">{{ item.name }}</a>
      {% endfor %}
    </div>
  </div>
</header>

<!-- Load SimpleJekyllSearch Logic -->
<script src="https://unpkg.com/simple-jekyll-search@latest/dest/simple-jekyll-search.min.js"></script>

<script>
  window.simpleJekyllSearch = new SimpleJekyllSearch({
    searchInput: document.getElementById('nav-search-input'),
    resultsContainer: document.getElementById('results-container'),
    json: '/search.json',
    searchResultTemplate: '<li><a href="{url}"><span class="res-t">{title}</span><span class="res-d">{date}</span></a></li>',
    noResultsText: '<li class="no-res">No results found</li>',
    limit: 10,
    fuzzy: false
  })
</script>
