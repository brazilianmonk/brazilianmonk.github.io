<header class="site-header">
  <h3 class="site-title">
    <a href="{{ site.github.url }}/"> <img src="/assets/img/logo-img.jpg" width="250" class="no-style"></a>
  </h3>

  <form class="nav-search" action="https://www.google.com/search" method="get" target="_blank" id="google-search-form">
    <input type="hidden" name="q" id="google-search-query">
    <div class="search-input-wrapper">
      <i class="fa fa-search search-icon" style="cursor: pointer;" onclick="document.getElementById('google-search-form').requestSubmit();"></i>
      <input type="text" id="nav-search-input" placeholder="Search..." required>
    </div>
  </form>

  <nav class="menu-list">
    {% for item in site.data.settings.menu %}
      <a href="{{ site.github.url }}/{{ item.url }}" class="menu-link">{{ item.name }}</a>
    {% endfor %}
  </nav>

  <div class="dropdown">
    <button class="dropbtn" aria-label="Menu"><i class="fa fa-bars" aria-hidden="true"></i></button>
    <div class="dropdown-content">
      {% for item in site.data.settings.menu %}
        <a href="{{ site.github.url }}/{{ item.url }}" class="menu-link">{{ item.name }}</a>
      {% endfor %}
    </div>
  </div>
</header>

<script>
  document.getElementById('google-search-form').addEventListener('submit', function(e) {
    const searchInput = document.getElementById('nav-search-input');
    const googleQuery = document.getElementById('google-search-query');
    const userQuery = searchInput.value.trim();
    
    if (userQuery) {
      const siteDomain = "{{ site.url | replace: 'https://', '' | replace: 'http://', '' | replace: '/', '' }}";
      googleQuery.value = `site:${siteDomain} ${userQuery}`;
    } else {
      e.preventDefault();
    }
  });
</script>
