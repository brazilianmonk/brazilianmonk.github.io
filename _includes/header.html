<header class="site-header">
  <h3 class="site-title">
    <a href="{{ site.github.url }}/"> <img src="/assets/img/logo-img.jpg" width="250"></a>
  </h3>

  <div class="nav-search">
    <div class="search-input-wrapper">
      <i class="fa fa-search search-icon"></i>
      <input type="text" id="nav-search-input" placeholder="Search...">
    </div>
    <ul id="results-container"></ul>
  </div>

  <nav class="menu-list">
    {% for item in site.data.settings.menu %}
      <a href="{{ site.github.url }}/{{ item.url }}" class="menu-link">{{ item.name }}</a>
    {% endfor %}
  </nav>

  <div class="dropdown">
    <button class="dropbtn" aria-label="Menu"><i class="fa fa-bars" aria-hidden="true"></i></button>
    <div class="dropdown-content">
      {% for item in site.data.settings.menu %}
        <a href="{{ site.github.url }}/{{ item.url }}" class="menu-link">{{ item.name }}</a>
      {% endfor %}
    </div>
  </div>
</header>
<script src="https://cdn.jsdelivr.net/npm/simple-jekyll-search@1.10.0/dest/simple-jekyll-search.min.js"></script>

<script>
  window.addEventListener('load', function() {
    // Build search path
    var searchPath = "{{ site.url }}{{ site.baseurl }}/search.json";
    console.log("Search path:", searchPath);
    
    // Check if search.json exists
    fetch(searchPath)
      .then(response => {
        console.log("Fetch response status:", response.status);
        if (!response.ok) {
          throw new Error('search.json not found at ' + searchPath);
        }
        return response.json();
      })
      .then(data => {
        console.log("Search data loaded. Items found:", data.length);
        if (data.length === 0) {
          console.warn("Warning: search.json is empty. No posts or pages found.");
        }
        
        // Initialize search
        var sjs = SimpleJekyllSearch({
          searchInput: document.getElementById('nav-search-input'),
          resultsContainer: document.getElementById('results-container'),
          json: searchPath,
          searchResultTemplate: '<li><a href="{url}"><span class="res-t">{title}</span><span class="res-d">{date}</span></a></li>',
          noResultsText: '<li class="no-res" style="padding:10px; color: #999;">No results found</li>',
          limit: 10,
          fuzzy: false
        });
        
        console.log("Search initialized successfully!");
      })
      .catch(error => {
        console.error("Search initialization error:", error);
        alert("Search failed to load. Check browser console for details.");
      });
  });
</script>
