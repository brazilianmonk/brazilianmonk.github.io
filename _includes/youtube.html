<div class="youtube-container{% if include.ratio == "portrait" %} youtube-portrait{% endif %}">
  <iframe
    src="https://www.youtube.com/embed/{{ include.id }}{% if include.list %}?list={{ include.list }}{% endif %}"
    title="{{ include.title | default: 'YouTube video player' }}"
    loading="lazy"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen>
  </iframe>
</div>

<style>
  .youtube-container {
    position: relative;
    width: 100%;
    max-width: 800px;
    margin: 1rem auto;
    aspect-ratio: 16 / 9;
  }
  .youtube-container iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
    border-radius: 8px;
  }
  .youtube-container.youtube-portrait {
    max-width: 360px;
    aspect-ratio: 9 / 16;
  }
</style>
