<div id="scroll-track">
  <div id="monk">☸️</div>
</div>

<style>
  #scroll-track {
    position: fixed;
    bottom: 15px; /* Adjust this to move him higher or lower */
    left: 0;
    width: 100%;
    height: 50px;
    z-index: 9999;
    pointer-events: none; 
  }

  #monk {
    position: absolute;
    bottom: 0;
    left: 0%;
    font-size: 30px;
    line-height: 1;
    will-change: left;
    /* Smooths out tiny scrolls; remove if you want instant tracking */
    transition: left 0.1s ease-out; 
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const monk = document.getElementById('monk');

    window.addEventListener('scroll', () => {
      const scrollTop = window.scrollY;
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      
      if (docHeight <= 0) return;

      const scrollPercent = scrollTop / docHeight;
      
      // Get the exact width of the monk emoji dynamically (usually around 40px)
      const monkWidth = monk.offsetWidth || 40; 
      
      // Calculate total available walking space (Screen Width minus Monk Width)
      const maxMovePixels = window.innerWidth - monkWidth;
      
      // Calculate his current position in pixels
      const currentPositionPx = scrollPercent * maxMovePixels;
      
      // Move the monk precisely using pixels so he never overflows
      monk.style.left = `${currentPositionPx}px`;
      
    }, { passive: true });
  });
</script>
