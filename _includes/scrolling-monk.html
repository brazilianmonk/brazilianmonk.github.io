<div id="scroll-track">
  <div id="monk">🧘‍♂️</div>
</div>

<style>
  #scroll-track {
    position: fixed;
    bottom: 15px;
    left: 0;
    width: 100%;
    height: 50px;
    z-index: 9999;
    pointer-events: none; /* Let users click elements behind the track */
  }

  #monk {
    position: absolute;
    bottom: 0;
    left: 0%;
    font-size: 40px;
    line-height: 1;
    will-change: left; /* Optimizes browser rendering performance */
  }

  /* The walking/bobbing animation */
  .walking {
    animation: monkBob 0.6s infinite ease-in-out;
  }

  @keyframes monkBob {
    0%, 100% { transform: translateY(0) scaleX(1); }
    50% { transform: translateY(-10px) scaleX(0.95); } /* Bounces up and compresses slightly */
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const monk = document.getElementById('monk');
    let isScrolling;

    window.addEventListener('scroll', () => {
      const scrollTop = window.scrollY;
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      
      // Safety check for short pages that don't scroll
      if (docHeight <= 0) return;

      const scrollPercent = scrollTop / docHeight;
      
      // Keep a 5% margin so the emoji doesn't clip off the right edge
      const maxMove = 95; 
      const currentPosition = scrollPercent * maxMove;
      
      // Update position
      monk.style.left = `${currentPosition}%`;
      
      // Add walking animation class
      monk.classList.add('walking');
      
      // Stop the animation shorty after scrolling ceases
      window.clearTimeout(isScrolling);
      isScrolling = setTimeout(() => {
        monk.classList.remove('walking');
      }, 150);
    }, { passive: true }); // Passive listener improves scroll performance
  });
</script>
